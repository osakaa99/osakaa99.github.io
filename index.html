<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>osaka99 - Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --card: #1f1f1f;
      --text: #ffffff;
      --accent: #ff005c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .profile {
      text-align: center;
      margin-bottom: 2rem;
    }

    .profile img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 2px solid var(--accent);
    }

    .profile h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .links {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link {
      background-color: var(--card);
      border: 1px solid #333;
      padding: 1rem;
      text-align: center;
      border-radius: 10px;
      transition: 0.2s ease;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
    }

    .link:hover {
      background-color: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="profile">
    <img src="https://placekitten.com/200/200" alt="osaka99 profile pic">
    <h1>osaka99</h1>
    <p>Breakcore producer | Japanese vibes</p>
  </div>
  <div class="links">
    <a class="link" href="#">Latest Track</a>
    <a class="link" href="#">SoundCloud</a>
    <a class="link" href="#">Bandcamp</a>
    <a class="link" href="#">YouTube</a>
    <a class="link" href="#">Contact Me</a>
  </div>
</body>
</html>
